[package]
name = "floating-todo"
version = "0.1.0"
description = "A compact, always-on-top desktop task and reminder widget"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
name = "floating_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.5.1"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
